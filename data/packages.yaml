# Compatibility package inventory for the static Kernary site.
#
# This file locates compiled Corpus snapshots at build time. It is not the
# Registry API and does not prove that a package has been published. Every entry
# is explicitly typed; future Model, Adapter, Domain, and Plugin records belong
# in the Registry contract rather than being called Skills or Primes.

packages:
  - slug: frontend-design
    kind: corpus
    repo: skill-wiki/kernary-frontend-design
    compiledSubdir: corpus/dist
    description: >-
      The 797-unit release from the Kernary Frontend Design Domain Package.
      Its model, adapters, seven tools, validator, and optional Skill live in the
      owning domain repository.
    homepage: https://github.com/skill-wiki/kernary-frontend-design
    maintainers: [skill-wiki]
    tags: [frontend, design, accessibility, typography, motion]

  - slug: recipes
    kind: corpus
    repo: skill-wiki/kernary-engine
    subpath: examples/recipes
    compiledSubdir: primes/compiled
    description: A small cooking Corpus used to exercise an external model.
    maintainers: [skill-wiki]
    tags: [example, cooking]

  - slug: coding-style
    kind: corpus
    repo: skill-wiki/kernary-engine
    subpath: examples/coding-style
    compiledSubdir: primes/compiled
    description: A compatibility Corpus for team coding-style knowledge.
    maintainers: [skill-wiki]
    tags: [example, coding, style]

  - slug: hello-world
    kind: corpus
    repo: skill-wiki/kernary-engine
    subpath: examples/hello-world
    compiledSubdir: primes/compiled
    description: The smallest maintained compatibility Corpus and build example.
    maintainers: [skill-wiki]
    tags: [example, learning]

  - slug: backend-architecture
    kind: corpus
    repo: skill-wiki/kernary-corpus-backend
    compiledSubdir: compiled
    description: A compatibility Corpus for backend and distributed-system guidance.
    homepage: https://github.com/skill-wiki/kernary-corpus-backend
    maintainers: [skill-wiki]
    tags: [backend, microservices, architecture]

  - slug: security-appsec
    kind: corpus
    repo: skill-wiki/kernary-corpus-security
    compiledSubdir: compiled
    description: A compatibility Corpus for application-security guidance.
    homepage: https://github.com/skill-wiki/kernary-corpus-security
    maintainers: [skill-wiki]
    tags: [security, owasp, web, backend]

  - slug: web-style
    kind: corpus
    repo: skill-wiki/kernary-corpus-web-style
    compiledSubdir: compiled
    description: A compatibility Corpus for JavaScript and web style guidance.
    homepage: https://github.com/skill-wiki/kernary-corpus-web-style
    maintainers: [skill-wiki]
    tags: [web, javascript, style]

  - slug: android-compose
    kind: corpus
    repo: skill-wiki/kernary-corpus-android-compose
    compiledSubdir: compiled
    description: A compatibility Corpus for Jetpack Compose and Material guidance.
    homepage: https://github.com/skill-wiki/kernary-corpus-android-compose
    maintainers: [skill-wiki]
    tags: [android, compose, material3, mobile]

  - slug: ios-swift
    kind: corpus
    repo: skill-wiki/kernary-corpus-ios-swift
    compiledSubdir: compiled
    description: A compatibility Corpus for Swift API and style guidance.
    homepage: https://github.com/skill-wiki/kernary-corpus-ios-swift
    maintainers: [skill-wiki]
    tags: [ios, swift, mobile, api-design]
