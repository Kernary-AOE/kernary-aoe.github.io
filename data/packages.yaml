# Public package inventory for the static AOE site.
#
# This file locates compiled Corpus snapshots at build time. It is not the
# Registry API and does not prove that a package has been published. Every entry
# is explicitly typed; Model, Adapter, Domain, and Plugin records can be added
# here when their owning packages are ready.

packages:
  - slug: frontend-design
    kind: corpus
    repo: skill-wiki/kernary-frontend-design
    compiledSubdir: corpus/dist
    description: >-
      A 797-unit reference release from the AOE Frontend Design Domain
      Package. Its model, adapters, tools, validator, and optional Skill live in
      the owning domain repository.
    homepage: https://github.com/skill-wiki/kernary-frontend-design
    maintainers: [skill-wiki]
    tags: [frontend, design, accessibility, typography, motion]

  - slug: recipes
    kind: corpus
    repo: skill-wiki/kernary-engine
    subpath: examples/recipes
    compiledSubdir: primes/compiled
    description: A small cooking Corpus that demonstrates an external model.
    maintainers: [skill-wiki]
    tags: [example, cooking]

  - slug: coding-style
    kind: corpus
    repo: skill-wiki/kernary-engine
    subpath: examples/coding-style
    compiledSubdir: primes/compiled
    description: A team coding-style Corpus Package example.
    maintainers: [skill-wiki]
    tags: [example, coding, style]

  - slug: hello-world
    kind: corpus
    repo: skill-wiki/kernary-engine
    subpath: examples/hello-world
    compiledSubdir: primes/compiled
    description: The smallest maintained Corpus Package and build example.
    maintainers: [skill-wiki]
    tags: [example, learning]

  - slug: backend-architecture
