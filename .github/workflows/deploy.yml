name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      # Read the package inventory and vendor the owning repositories.
      # Engine and Frontend Design documentation is rendered directly from
      # these checkouts; a missing owner therefore fails the build.
      - name: Resolve package inventory
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          # Extract unique "owner/repo" → "dir" pairs from data/packages.yaml.
          # We use a tiny awk parser so we don't need yq/python in the runner.
          mapfile -t REPOS < <(awk '
            /^[[:space:]]*-/ { in_item=1 }
            in_item && /^[[:space:]]+repo:[[:space:]]*/ {
              gsub(/^[[:space:]]+repo:[[:space:]]*/, ""); print
            }
          ' data/packages.yaml | sort -u)
          # Emit one line per repo: "owner/repo dir".
          {
            for r in "${REPOS[@]}"; do
              base="${r##*/}"
              echo "$r $base"
            done
          } > .vendor-list.txt
          echo "Vendor list:"; cat .vendor-list.txt

      # Clone each unique source repo into external/<dir>. This is dynamic so
      # we never need to touch the workflow for an inventory-only update.
      - name: Vendor package source repos
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p external
          while IFS=' ' read -r repo dir; do
            [ -z "$repo" ] && continue
            echo "→ cloning $repo into external/$dir"
            git clone --depth 1 --branch main "https://github.com/$repo.git" "external/$dir"
            test -d "external/$dir/.git"
            git -C "external/$dir" rev-parse --verify HEAD
          done < .vendor-list.txt
          echo "Vendored:"; ls external 2>/dev/null || echo "(none)"

      - name: Verify documentation owners
        run: |
          test -f external/aoe-engine/docs/start/index.md
          test -f external/aoe-frontend-design/docs/overview.md

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Compiled corpora are build outputs, so the owning repositories keep
      # them out of Git. Without this step the site still builds, but every
      # package whose artifacts live in `aoe-engine` or `aoe-frontend-design`
      # silently disappears from the registry, browse, and atom routes.
      - name: Compile vendored corpora
        run: |
          set -euo pipefail
          bun install --cwd external/aoe-engine --frozen-lockfile
          bun run --cwd external/aoe-engine compile-examples
          bun run --cwd external/aoe-frontend-design corpus:build

      - name: Verify compiled corpora
        run: |
          set -euo pipefail
          for index in \
            external/aoe-frontend-design/corpus/dist/_index.xml \
            external/aoe-engine/examples/hello-world/primes/compiled/_index.xml \
            external/aoe-engine/examples/recipes/primes/compiled/_index.xml \
            external/aoe-engine/examples/coding-style/primes/compiled/_index.xml; do
            test -f "$index" || { echo "missing compiled index: $index"; exit 1; }
          done

      - name: Build
        env:
          AOE_ENGINE_ROOT: external/aoe-engine
          AOE_FRONTEND_DESIGN_ROOT: external/aoe-frontend-design
        run: bun run build

      # The registry is data-driven, so a vendoring or compilation regression
      # would otherwise ship as a quietly smaller site.
      - name: Verify published registry
        run: |
          set -euo pipefail
          missing=0
          while read -r slug; do
            [ -z "$slug" ] && continue
            grep -q "$slug" dist/marketplace/index.html || { echo "package absent from registry page: $slug"; missing=1; }
          done < <(awk '/^[[:space:]]*-[[:space:]]*slug:/ { sub(/^[[:space:]]*-[[:space:]]*slug:[[:space:]]*/, ""); print }' data/packages.yaml)
          test -d dist/atom/frontend-design || { echo "reference corpus produced no atom routes"; missing=1; }
          exit "$missing"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
